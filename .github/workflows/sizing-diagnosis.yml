name: Explorer sizing diagnosis
on:
  push:
    branches: [test/real-app-rendering]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record root and input hit tests around measured caption candidates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -Type Directory -Force evidence | Out-Null
          ./tools/Test-DesktopReadiness.ps1 -OutputDirectory evidence
          Add-Type -Path tests/desktop/DesktopProbe.cs -ReferencedAssemblies System.Drawing.dll
          [DesktopProbe]::PhysicalCoordinates()
          $before=@([DesktopProbe]::Windows() | ForEach-Object Handle)
          New-Item -Type Directory -Force evidence/empty | Out-Null
          Start-Process explorer.exe -ArgumentList ('"'+(Resolve-Path evidence/empty).Path+'"')
          $target=$null
          for($i=0;$i -lt 40 -and -not $target;$i++) {
            Start-Sleep -Milliseconds 250
            $target=[DesktopProbe]::Windows() | Where-Object { $_.Class -eq 'CabinetWClass' -and $_.Visible -and $_.Handle -notin $before } | Select-Object -First 1
          }
          if(-not $target){throw 'No Explorer fixture'}
          $hwnd=[IntPtr]$target.Handle
          $results=@()
          try {
            foreach($mode in @('normal','maximized','restored-narrow')) {
              $null=[DesktopProbe]::ShowWindowAsync($hwnd,9)
              Start-Sleep -Milliseconds 300
              $width=if($mode -eq 'restored-narrow'){660}else{944}
              $null=[DesktopProbe]::SetWindowPos($hwnd,[IntPtr]::Zero,35,40,$width,520,0x14)
              if($mode -eq 'maximized'){$null=[DesktopProbe]::ShowWindowAsync($hwnd,3)}
              $null=[DesktopProbe]::SetForegroundWindow($hwnd)
              Start-Sleep -Seconds 2
              $c=[DesktopProbe]::Caption($hwnd)
              $b=$c.Title.Buttons[2];$rows=@()
              foreach($attempt in 0..3) {
                $left=$c.Controls.Left-$b.Width*($attempt+1)
                foreach($x in @(($left+2),($left+[int]($b.Width/2)),($left+$b.Width-3))) {
                  for($y=$b.Top;$y -lt $b.Bottom;$y++) {
                    $input=[DesktopProbe]::WindowFromPoint([DesktopProbe+Point]::new($x,$y))
                    $rows+=@{x=$x;y=$y;attempt=$attempt;input=[DesktopProbe]::Describe($input);hit=[DesktopProbe]::Hit($input,$x,$y);rootHit=[DesktopProbe]::Hit($hwnd,$x,$y)}
                  }
                }
              }
              $results+=@{state=$mode;caption=$c;rows=$rows}
              $null=[DesktopProbe]::CaptureCaption($hwnd,((Resolve-Path evidence).Path+'/'+$mode+'.png'))
            }
          } finally {
            $results | ConvertTo-Json -Depth 12 | Set-Content evidence/hit-grid.json -Encoding UTF8
            $null=[DesktopProbe]::PostMessage($hwnd,0x10,[IntPtr]::Zero,[IntPtr]::Zero)
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: explorer-sizing-diagnosis
          path: evidence/
          retention-days: 14
