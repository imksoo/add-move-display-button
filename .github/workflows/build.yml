name: Windows SDK build and startup tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: MSVC x64 ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure MSVC and official Windows SDK
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build with warnings as errors
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - name: Geometry, SDK, rendering, inactive UI, and actual EXE loader tests
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure --verbose --output-junit test-results.xml
      - name: Actual EXE normal startup, event loop, and clean exit
        shell: pwsh
        run: ./tools/Test-Startup.ps1 -ExecutablePath build/${{ matrix.configuration }}/MoveToMonitorButton.exe -OutputPath build/startup-result.json
      - name: Upload test evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-test-evidence-${{ matrix.configuration }}
          path: |
            build/inactive-*.bmp
            build/inactive-result.json
            build/inactive-*.txt
            build/caption-native-*.bmp
            build/test-results.xml
            build/startup-result.json
            build/${{ matrix.configuration }}/build-info.json
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 30
  host-tests:
    name: Formatting and Linux API simulations (not Windows runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check consistent C++ formatting
        run: |
          python -m venv .format-env
          .format-env/bin/python -m pip install clang-format==18.1.8
          .format-env/bin/clang-format --dry-run --Werror src/app.cpp src/app.hpp src/placement.cpp src/placement.hpp src/diagnostics.cpp src/main.cpp src/win32_helpers.hpp src/caption_appearance.cpp src/caption_appearance.hpp tests/caption_style_test.cpp tests/appearance_stub.cpp tests/app_test_access.hpp tests/sdk_helpers_test.cpp tests/window_logic_test.cpp tests/placement_regression_test.cpp src/inactive_buttons.cpp src/inactive_buttons.hpp tests/inactive_buttons_stub.cpp tests/inactive_overlay_test.cpp tests/desktop_fixture.hpp
      - name: Configure Clang simulations and sanitizers
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DMTMB_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --verbose
      - name: Test release evidence validation
        run: python tests/package_release_test.py
