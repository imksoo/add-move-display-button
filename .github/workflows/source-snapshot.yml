name: Development source snapshot
on:
  push:
    branches: [build/caption-release]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          mkdir evidence
          git archive --format=zip --output=evidence/source.zip HEAD
          python -m pip download --only-binary=:all: --no-deps clang-format==18.1.8 --dest evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: caption-release-source
          path: evidence/
          if-no-files-found: error
          retention-days: 1
