name: Real application caption compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_windows11:
        description: 'Also diagnose the currently blocked Windows 11 Arm desktop (not a Server pass)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: real-apps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk-checks:
    name: SDK builds and sanitizer regressions
    uses: ./.github/workflows/build.yml
  build:
    name: Build the actual x64 executable
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure --output-junit test-results.xml
      - name: Normal startup and package the exact EXE for both desktop jobs
        shell: pwsh
        run: |
          ./tools/Test-Startup.ps1 -ExecutablePath build/Release/MoveToMonitorButton.exe -OutputPath build/startup-result.json
          New-Item -ItemType Directory -Force dist/docs | Out-Null
          Copy-Item build/Release/MoveToMonitorButton.exe,build/Release/build-info.json,build/startup-result.json,build/test-results.xml,README.md,LICENSE dist/
          Copy-Item docs/*.md dist/docs/
          Copy-Item tools/Check-Startup.cmd dist/
          New-Item -ItemType Directory -Force dist/test-programs | Out-Null
          Copy-Item build/Release/inactive_overlay_test.exe dist/test-programs/
          $hash = (Get-FileHash dist/MoveToMonitorButton.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MoveToMonitorButton.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          $metadata = Get-Content dist/build-info.json -Raw | ConvertFrom-Json
          $metadata | Add-Member -NotePropertyName commit -NotePropertyValue $env:GITHUB_SHA
          $metadata | Add-Member -NotePropertyName runUrl -NotePropertyValue "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $metadata | Add-Member -NotePropertyName executableSha256 -NotePropertyValue $hash
          $metadata | ConvertTo-Json | Set-Content dist/build-info.json -Encoding utf8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-app-test-executable
          path: dist/
          if-no-files-found: error
          retention-days: 14
  desktop:
    name: Real apps on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: real-app-test-executable
          path: app-under-test
      - name: Verify visible desktop pixels without changing Windows settings
        shell: powershell
        run: ./tools/Test-DesktopReadiness.ps1 -OutputDirectory real-app-evidence
      - name: Test real application caption pixels, geometry, hover, and stability
        shell: powershell
        run: ./tools/Test-RealApps.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -OutputDirectory real-app-evidence
      - name: Test the actual EXE on inactive windows and first-click menus
        shell: powershell
        run: ./tools/Test-InactiveWindows.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -TestPath app-under-test/test-programs/inactive_overlay_test.exe -OutputDirectory real-app-evidence
      - name: Keep all results and screenshots including environment blocks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-app-evidence-${{ matrix.os }}
          path: real-app-evidence/
          if-no-files-found: warn
          retention-days: 14
  windows11-diagnostic:
    name: Windows 11 Arm diagnostic (coverage not established)
    if: github.event_name == 'workflow_dispatch' && inputs.include_windows11
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: real-app-test-executable
          path: app-under-test
      - name: Verify visible desktop pixels without changing Windows settings
        shell: powershell
        run: ./tools/Test-DesktopReadiness.ps1 -OutputDirectory real-app-evidence
      - name: Test real application caption pixels, geometry, hover, and stability
        shell: powershell
        run: ./tools/Test-RealApps.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -OutputDirectory real-app-evidence
      - name: Test the actual EXE on inactive windows and first-click menus
        shell: powershell
        run: ./tools/Test-InactiveWindows.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -TestPath app-under-test/test-programs/inactive_overlay_test.exe -OutputDirectory real-app-evidence
      - name: Keep all results and screenshots including environment blocks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-app-evidence-windows-11-arm
          path: real-app-evidence/
          if-no-files-found: warn
          retention-days: 14
  tested-release:
    name: Package only the EXE verified on both Server desktops
    needs: [build, desktop, sdk-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: real-app-test-executable
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: real-app-evidence-windows-20*
          path: dist/real-app-evidence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
      - name: Verify result coverage and create release files without rebuilding
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python source/tools/package_release.py dist release-assets --commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MoveToMonitorButton-0.1.8-real-app-tested
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: github-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
  release:
    name: Publish verified assets to GitHub Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tested-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: github-release-assets
          path: release-assets
      - name: Create a versioned release, verify uploaded files, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import re,pathlib; print(re.search(r"project\(MoveToMonitorButton VERSION ([0-9]+\.[0-9]+\.[0-9]+)",pathlib.Path("CMakeLists.txt").read_text())[1])')
          tag="v$version"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > existing-tags.txt
          if grep -Fxq "$tag" existing-tags.txt; then
            echo "Release $tag already exists; its assets will NOT be overwritten." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" > tag-refs.json
          python - "$tag" <<'PYTHON'
          import json, os, sys
          for ref in json.load(open('tag-refs.json')):
              if ref['ref'] == 'refs/tags/' + sys.argv[1]:
                  assert ref['object']['type'] == 'commit' and ref['object']['sha'] == os.environ['GITHUB_SHA'], 'Tag already points elsewhere'
          PYTHON
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "MoveToMonitorButton $tag" \
            --notes-file "docs/releases/$tag.md" --draft
          mkdir release-roundtrip
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release-roundtrip
          (cd release-roundtrip && sha256sum -c SHA256SUMS.txt)
          cmp release-assets/SHA256SUMS.txt release-roundtrip/SHA256SUMS.txt
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "### Release published: $tag" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
