name: Real application caption compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_windows11:
        description: 'Also run isolated desktop preflight diagnostics'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: real-apps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk-checks:
    name: SDK builds and sanitizer regressions
    uses: ./.github/workflows/build.yml
  build:
    name: Build the actual x64 executable
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure --output-junit test-results.xml
      - name: Normal startup and package the exact EXE for all desktop jobs
        shell: pwsh
        run: |
          ./tools/Test-Startup.ps1 -ExecutablePath build/Release/MoveToMonitorButton.exe -OutputPath build/startup-result.json
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/MoveToMonitorButton.exe,build/Release/build-info.json,build/startup-result.json,build/test-results.xml,LICENSE dist/
          Copy-Item docs/PORTABLE.md dist/README.md
          New-Item -ItemType Directory -Force dist/test-programs | Out-Null
          Copy-Item build/Release/inactive_overlay_test.exe,build/Release/hosted_display_scale.exe,build/Release/multi_monitor_test.exe dist/test-programs/
          $hash = (Get-FileHash dist/MoveToMonitorButton.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MoveToMonitorButton.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          $metadata = Get-Content dist/build-info.json -Raw | ConvertFrom-Json
          $metadata | Add-Member -NotePropertyName commit -NotePropertyValue $env:GITHUB_SHA
          $metadata | Add-Member -NotePropertyName runUrl -NotePropertyValue "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $metadata | Add-Member -NotePropertyName executableSha256 -NotePropertyValue $hash
          $metadata | ConvertTo-Json | Set-Content dist/build-info.json -Encoding utf8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-app-test-executable
          path: dist/
          if-no-files-found: error
          retention-days: 14
  desktop:
    name: Real apps on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: real-app-test-executable
          path: app-under-test
      - name: Verify visible desktop pixels without changing Windows settings
        timeout-minutes: 3
        shell: powershell
        run: ./tools/Test-DesktopReadiness.ps1 -OutputDirectory real-app-evidence
      - name: Test real application caption pixels, geometry, hover, and stability
        shell: powershell
        run: ./tools/Test-RealApps.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -OutputDirectory real-app-evidence
      - name: Test the actual EXE on inactive windows and first-click menus
        shell: powershell
        run: ./tools/Test-InactiveWindows.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -TestPath app-under-test/test-programs/inactive_overlay_test.exe -OutputDirectory real-app-evidence
      - name: Keep all results and screenshots including environment blocks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-app-evidence-${{ matrix.os }}
          path: real-app-evidence/
          if-no-files-found: warn
          retention-days: 14
  desktop-preflight-diagnostic:
    name: Isolated desktop preflight on ${{ matrix.os }}
    if: (github.event_name == 'workflow_dispatch' && inputs.include_windows11) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'diagnose/desktop-'))
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision privacy policy on the disposable Arm runner
        if: matrix.os == 'windows-11-arm'
        timeout-minutes: 3
        shell: powershell
        run: ./tools/Initialize-HostedDesktop.ps1 -OutputDirectory desktop-preflight-evidence/desktop-setup
      - name: Observe desktop context and exact sentinel pixels
        timeout-minutes: 3
        shell: powershell
        run: ./tools/Test-DesktopReadiness.ps1 -OutputDirectory desktop-preflight-evidence
      - name: Preserve diagnostic evidence even when the environment is blocked
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-preflight-${{ matrix.os }}
          path: desktop-preflight-evidence/
          if-no-files-found: warn
          retention-days: 14
  windows11-diagnostic:
    name: Windows 11 Arm prepared desktop and real apps
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: real-app-test-executable
          path: app-under-test
      - name: Provision privacy and WSL prerequisites on the disposable Windows 11 runner
        timeout-minutes: 9
        shell: powershell
        run: ./tools/Initialize-HostedDesktop.ps1 -OutputDirectory real-app-evidence/desktop-setup -PrepareApplicationTests
      - name: Verify Settings alignment at actual 150 and 200 percent display scales
        shell: powershell
        run: ./tools/Test-SettingsDpi.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -DisplaySetupPath app-under-test/test-programs/hosted_display_scale.exe -OutputDirectory real-app-evidence
      - name: Verify visible desktop pixels without changing Windows settings
        timeout-minutes: 3
        shell: powershell
        run: ./tools/Test-DesktopReadiness.ps1 -OutputDirectory real-app-evidence
      - name: Test real application caption pixels, geometry, hover, and stability
        shell: powershell
        run: ./tools/Test-RealApps.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -OutputDirectory real-app-evidence -RequireWindows11Coverage
      - name: Verify paired buttons on Settings at 100 percent
        shell: powershell
        run: ./tools/Test-RealApps.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -OutputDirectory real-app-evidence/paired -RequireWindows11Coverage -SettingsOnly -PairedButtons -ExpectedDpi 96
      - name: Test the actual EXE on inactive windows and first-click menus
        shell: powershell
        run: ./tools/Test-InactiveWindows.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -TestPath app-under-test/test-programs/inactive_overlay_test.exe -OutputDirectory real-app-evidence
      - name: Keep all results and screenshots including environment blocks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-app-evidence-windows-11-arm
          path: real-app-evidence/
          if-no-files-found: warn
          retention-days: 14
  custom-caption-apps:
    name: ChatGPT custom frames at 100, 150 and 200 percent
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: real-app-test-executable
          path: app-under-test
      - name: Prepare disposable desktop and WSL prerequisites
        timeout-minutes: 9
        shell: powershell
        run: ./tools/Initialize-HostedDesktop.ps1 -OutputDirectory chatgpt-evidence/desktop-setup -PrepareApplicationTests
      - name: Verify exact two-color capture preflight
        shell: powershell
        run: ./tools/Test-DesktopReadiness.ps1 -OutputDirectory chatgpt-evidence
      - name: Install official ChatGPT and ChatGPT Classic from Microsoft Store
        timeout-minutes: 12
        shell: powershell
        run: ./tools/Install-ChatGPTTestApps.ps1 -OutputDirectory chatgpt-evidence
      - name: Verify actual ChatGPT captions at 100 percent
        shell: powershell
        run: ./tools/Test-RealApps.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -OutputDirectory chatgpt-evidence -RequireWindows11Coverage -ChatGPTOnly -ExpectedDpi 96
      - name: Verify paired ChatGPT buttons at 100 percent
        shell: powershell
        run: ./tools/Test-RealApps.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -OutputDirectory chatgpt-evidence/paired -RequireWindows11Coverage -ChatGPTOnly -PairedButtons -ExpectedDpi 96
      - name: Verify actual ChatGPT captions at 150 and 200 percent
        shell: powershell
        run: ./tools/Test-SettingsDpi.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -DisplaySetupPath app-under-test/test-programs/hosted_display_scale.exe -OutputDirectory chatgpt-evidence -ChatGPTOnly
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-app-evidence-chatgpt
          path: chatgpt-evidence/
          if-no-files-found: warn
          retention-days: 14
  multi-monitor:
    name: Actual signed-driver multi-monitor navigation
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: real-app-test-executable
          path: app-under-test
      - name: Verify visible desktop with exact sentinel colors
        shell: powershell
        run: ./tools/Test-DesktopReadiness.ps1 -OutputDirectory multi-monitor-evidence
      - name: Install pinned signed driver and exercise actual extended desktop
        shell: powershell
        run: ./tools/Test-MultiMonitor.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -TestPath app-under-test/test-programs/multi_monitor_test.exe
      - name: Keep evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-app-evidence-multi-monitor
          path: multi-monitor-evidence/
          if-no-files-found: warn
          retention-days: 14
  tested-release:
    name: Package the EXE verified on Server and Windows 11 desktops
    needs: [build, desktop, sdk-checks, windows11-diagnostic, custom-caption-apps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: real-app-test-executable
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: real-app-evidence-*
          path: dist/real-app-evidence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
      - name: Verify result coverage and create release files without rebuilding
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python source/tools/package_release.py dist release-assets --commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: github-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
  release:
    name: Publish verified assets to GitHub Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tested-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: github-release-assets
          path: release-assets
      - name: Create a versioned release, verify uploaded files, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import re,pathlib; print(re.search(r"project\(MoveToMonitorButton VERSION ([0-9]+\.[0-9]+\.[0-9]+)",pathlib.Path("CMakeLists.txt").read_text())[1])')
          tag="v$version"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > existing-tags.txt
          if grep -Fxq "$tag" existing-tags.txt; then
            echo "Release $tag already exists; its assets will NOT be overwritten." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" > tag-refs.json
          python - "$tag" <<'PYTHON'
          import json, os, sys
          for ref in json.load(open('tag-refs.json')):
              if ref['ref'] == 'refs/tags/' + sys.argv[1]:
                  assert ref['object']['type'] == 'commit' and ref['object']['sha'] == os.environ['GITHUB_SHA'], 'Tag already points elsewhere'
          PYTHON
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          cp "docs/releases/$tag.md" release-notes.md
          printf '\nビルド・テスト: [GitHub Actions](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "MoveToMonitorButton $tag" \
            --notes-file release-notes.md --draft
          mkdir release-roundtrip
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release-roundtrip
          (cd release-roundtrip && sha256sum -c SHA256SUMS.txt)
          cmp release-assets/SHA256SUMS.txt release-roundtrip/SHA256SUMS.txt
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "### Release published: $tag" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
