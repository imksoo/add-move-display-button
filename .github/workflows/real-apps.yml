name: Real application caption compatibility
on:
  push:
    branches: [main, test/real-app-rendering]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-apps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build the actual x64 executable
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-app-test-executable
          path: |
            build/Release/MoveToMonitorButton.exe
            build/Release/build-info.json
          if-no-files-found: error
          retention-days: 14
  desktop:
    name: Real apps on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: real-app-test-executable
          path: app-under-test
      - name: Verify visible desktop pixels without changing Windows settings
        shell: powershell
        run: ./tools/Test-DesktopReadiness.ps1 -OutputDirectory real-app-evidence
      - name: Test real application caption pixels, geometry, hover, and stability
        shell: powershell
        run: ./tools/Test-RealApps.ps1 -ExecutablePath app-under-test/MoveToMonitorButton.exe -OutputDirectory real-app-evidence
      - name: Keep all results and screenshots including environment blocks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-app-evidence-${{ matrix.os }}
          path: real-app-evidence/
          if-no-files-found: warn
          retention-days: 14
