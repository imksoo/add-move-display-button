name: Import reviewed native caption patch
on:
  push:
    branches: [build/native-caption]
    paths: ['.github/native-caption-import/**', '.github/workflows/import-native-caption.yml']
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'imksoo/add-move-display-button' && github.ref == 'refs/heads/build/native-caption'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply source only (workflow edits use the authorized connector)
        shell: bash
        run: |
          python - <<'PY'
          import gzip, hashlib
          from pathlib import Path
          parts = ['0', '1', '2a', '2b', '2c', '2d', '3']
          packed = b''.join((Path('.github/native-caption-import') / (part + '.gz')).read_bytes() for part in parts)
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '7703592d61562e8fd8ca5cba24e27393a374cd77a91e48722c252bdfdf9076fe', 'Patch digest mismatch'
          Path('/tmp/native-caption.patch').write_bytes(patch)
          PY
          git apply --check /tmp/native-caption.patch
          git apply /tmp/native-caption.patch
          git restore .github/workflows
          git rm -r .github/native-caption-import
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests CMakeLists.txt README.md assets docs
          git diff --cached --check
          git commit -m 'Match measured caption buttons with translucent appearance and Windows integration tests'
          git push origin HEAD:refs/heads/build/native-caption
          git rev-parse HEAD HEAD^{tree}
